name: Release Charts (OCI)
on:
  push:
    branches: [ main ]
    paths: [ 'charts/**' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Critical for pushing to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish Charts
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for chart in charts/*; do
            if [ -d "$chart" ]; then
              helm package "$chart"
              chart_package=$(ls *.tgz | head -n 1)
              helm push "$chart_package" "oci://ghcr.io/${REPO_OWNER}/charts"
              rm "$chart_package"
            fi
          done