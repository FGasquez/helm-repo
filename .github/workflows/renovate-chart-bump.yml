name: Renovate Chart Version Bump

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'charts/affine/values.yaml'
      - 'charts/affine/Chart.yaml'

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-chart:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'renovate') || contains(github.event.pull_request.title, 'affine')
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Bump chart version and appVersion
        id: bump
        run: |
          set -euo pipefail

          CHART_DIR="charts/affine"
          CHART_FILE="$CHART_DIR/Chart.yaml"
          VALUES_FILE="$CHART_DIR/values.yaml"
          README_FILE="README.md"

          APP_VERSION=$(yq e '.affine.image.tag' "$VALUES_FILE")
          APP_VERSION="${APP_VERSION//\"}"

          CURRENT_APP_VERSION=$(yq e '.appVersion' "$CHART_FILE")
          CURRENT_APP_VERSION="${CURRENT_APP_VERSION//\"}"
          CURRENT_VERSION=$(yq e '.version' "$CHART_FILE")

          if [ "$APP_VERSION" = "$CURRENT_APP_VERSION" ]; then
            echo "No appVersion change needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Bump patch version of the chart
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          yq e -i ".appVersion = \"$APP_VERSION\"" "$CHART_FILE"
          yq e -i ".version = \"$NEW_VERSION\"" "$CHART_FILE"

          # Update README table
          sed -i -E "s/\| \[affine\]\([^|]+\) \| [^|]+ \| [^|]+ \| [^|]+ \|/| [affine]($CHART_DIR) | AFFiNE — an open-source knowledge management and collaboration platform | $NEW_VERSION | $APP_VERSION |/" "$README_FILE"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/affine/Chart.yaml README.md
          git commit -m "chore(affine): bump chart version to ${{ steps.bump.outputs.new_version }} and appVersion to ${{ steps.bump.outputs.app_version }}" || echo "Nothing to commit"
          git push origin ${{ github.head_ref }}
