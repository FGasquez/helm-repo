apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "discord-bot.fullname" . }}
data:
{{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- if .Values.bot.customMessages }}
  messagesFile.yaml: |-
{{- toYaml .Values.bot.customMessages | nindent 4 }}
{{- end }}